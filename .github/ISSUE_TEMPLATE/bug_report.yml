name: Bug report
description: 报告部署脚本或文档问题
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索现有 Issue，并删除日志中的密钥、令牌和服务器地址。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么，期望发生什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行...
        2. 选择...
        3. 看到...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Docker、PowerShell 或 Shell 版本
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的日志或截图
      description: 请勿粘贴真实凭证或公网 IP
    validations:
      required: false
